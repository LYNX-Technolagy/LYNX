<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 — Page Not Found | LYNX Technology</title>
    <meta name="description" content="The page you're looking for doesn't exist. Return to LYNX Technology for IT support, web development, and product solutions.">
    <link rel="canonical" href="https://lynxtechnology.com/404">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M15 60 Q50 20 85 60 Q50 80 15 60Z' stroke='white' stroke-width='4' fill='none'/%3E%3Ccircle cx='50' cy='55' r='10' stroke='white' stroke-width='3' fill='none'/%3E%3Ccircle cx='50' cy='55' r='3' fill='white'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ===== 404 Page Specific Styles ===== */

        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .error-page .glow-orb {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
            top: -10%;
            right: -10%;
            pointer-events: none;
        }

        .error-page .glow-orb-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.02) 0%, transparent 70%);
            bottom: -10%;
            left: -10%;
            pointer-events: none;
        }

        .error-content {
            text-align: center;
            max-width: 32rem;
            position: relative;
            z-index: 1;
        }

        .error-content .lynx-icon {
            display: inline-block;
            width: 5rem;
            height: 5rem;
            margin-bottom: 2rem;
            opacity: 0.3;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .error-content .error-code {
            font-size: clamp(6rem, 20vw, 10rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, #ffffff 0%, #737373 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 80px rgba(255, 255, 255, 0.05);
        }

        .error-content h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.75rem;
            color: #fff;
        }

        .error-content p {
            color: #a3a3a3;
            font-size: 1.0625rem;
            line-height: 1.7;
            margin-bottom: 2rem;
            max-width: 28rem;
            margin-left: auto;
            margin-right: auto;
        }

        .error-content .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2.5rem;
        }

        .error-content .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.875rem 2rem;
            font-size: 0.875rem;
            font-weight: 600;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            min-width: 180px;
        }

        .error-content .btn-primary:hover {
            background: #e5e5e5;
            transform: scale(0.97);
        }

        .error-content .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.875rem 2rem;
            font-size: 0.875rem;
            font-weight: 500;
            background: transparent;
            color: #d4d4d4;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            min-width: 180px;
        }

        .error-content .btn-secondary:hover {
            border-color: rgba(255, 255, 255, 0.4);
            color: #fff;
        }

        /* Quick Links */
        .quick-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 1.5rem;
            margin-top: 0.5rem;
        }

        .quick-links a {
            color: #737373;
            text-decoration: none;
            font-size: 0.8125rem;
            transition: color 0.3s;
            padding: 0.25rem 0.5rem;
        }

        .quick-links a:hover {
            color: #fff;
        }

        .quick-links .separator {
            color: rgba(255, 255, 255, 0.1);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .error-content .lynx-icon {
                width: 4rem;
                height: 4rem;
                margin-bottom: 1.5rem;
            }

            .error-content .error-code {
                font-size: clamp(5rem, 16vw, 7rem);
            }

            .error-content p {
                font-size: 1rem;
            }

            .error-content .btn-group {
                flex-direction: column;
                align-items: center;
            }

            .error-content .btn-primary,
            .error-content .btn-secondary {
                width: 100%;
                max-width: 280px;
            }

            .quick-links {
                flex-direction: column;
                align-items: center;
                gap: 0.4rem;
            }

            .quick-links .separator {
                display: none;
            }

            .error-page .glow-orb {
                width: 300px;
                height: 300px;
                top: -20%;
                right: -20%;
            }

            .error-page .glow-orb-2 {
                width: 250px;
                height: 250px;
                bottom: -20%;
                left: -20%;
            }
        }

        @media (max-width: 480px) {
            .error-content .error-code {
                font-size: clamp(4rem, 14vw, 5.5rem);
            }

            .error-content h1 {
                font-size: 1.25rem;
            }

            .error-content p {
                font-size: 0.9375rem;
            }

            .error-content .lynx-icon {
                width: 3.5rem;
                height: 3.5rem;
            }

            .error-content .btn-primary,
            .error-content .btn-secondary {
                font-size: 0.8125rem;
                padding: 0.75rem 1.5rem;
                min-width: unset;
                width: 100%;
            }

            .quick-links a {
                font-size: 0.75rem;
            }
        }

        /* Accessibility - reduce motion */
        @media (prefers-reduced-motion: reduce) {
            .error-content .lynx-icon {
                animation: none;
            }
        }
    </style>
</head>

<body class="noise grid-bg">

    <!-- ============ 404 PAGE ============ -->
    <main class="error-page">
        <!-- Decorative glow orbs -->
        <div class="glow-orb"></div>
        <div class="glow-orb-2"></div>

        <div class="error-content">
            <!-- LYNX Icon -->
            <svg class="lynx-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 60 Q50 20 85 60 Q50 80 15 60Z" stroke="white" stroke-width="3" stroke-linejoin="round" />
                <circle cx="50" cy="55" r="10" stroke="white" stroke-width="2.5" />
                <circle cx="50" cy="55" r="3" fill="white" />
            </svg>

            <!-- Error Code -->
            <div class="error-code">404</div>

            <!-- Message -->
            <h1>Page not found</h1>
            <p>
                The page you're looking for doesn't exist — or hasn't been built yet.
                Let's get you back on track.
            </p>

            <!-- Action Buttons -->
            <div class="btn-group">
                <a href="/" class="btn-primary">
                    <i class="fas fa-home" style="margin-right:0.5rem;"></i> Back to Home
                </a>
                <a href="contact.html" class="btn-secondary">
                    <i class="fas fa-envelope" style="margin-right:0.5rem;"></i> Contact Us
                </a>
            </div>

            <!-- Quick Links -->
            <div class="quick-links">
                <a href="troubleshoot.html">Troubleshoot</a>
                <span class="separator">·</span>
                <a href="fullstack.html">Full-Stack</a>
                <span class="separator">·</span>
                <a href="venu.html">Venu</a>
                <span class="separator">·</span>
                <a href="contact.html">Contact</a>
            </div>
        </div>
    </main>

    <script>
        // ============================================================
        // KEYBOARD SHORTCUT - Press "H" to go home
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'h' || e.key === 'H') {
                if (!e.ctrlKey && !e.metaKey && !e.altKey) {
                    window.location.href = '/';
                }
            }
        });

        // ============================================================
        // TITLE CHANGE - Fun Easter egg after 3 seconds
        // ============================================================
        setTimeout(() => {
            const originalTitle = document.title;
            const titles = [
                '🦊 Lost? We can help!',
                '🔍 Still looking?',
                '✨ LYNX knows the way',
                '🏠 Maybe start from home?'
            ];
            let index = 0;

            const interval = setInterval(() => {
                document.title = titles[index % titles.length];
                index++;
                if (index >= titles.length * 2) {
                    clearInterval(interval);
                    document.title = originalTitle;
                }
            }, 2000);
        }, 3000);

        // ============================================================
        // CONSOLE EASTER EGG
        // ============================================================
        console.log('🦊 LYNX Technology — 404 Page');
        console.log('  💡 Tip: Press "H" to go home');
        console.log('  🚀 Visit lynxtechnology.com for products & services');
    </script>

</body>

</html>
